# Wöchentliche Update-PRs, gruppiert, nur Minor/Patch. Major-Sprünge (TypeScript, Node-Typen,
# Payload, Expo-SDK …) bewusst von Hand – Payload und Expo geben die passenden Versionen vor.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      payload:
        patterns: ['payload', '@payloadcms/*']
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # React Native und React gibt das Expo-SDK exakt vor
      - dependency-name: 'react-native'
        update-types: [version-update:semver-minor]
      - dependency-name: 'react'
        update-types: [version-update:semver-minor]
      - dependency-name: 'react-dom'
        update-types: [version-update:semver-minor]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
