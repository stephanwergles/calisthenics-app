# Nur für die lokale Entwicklung: Postgres wie auf dem Server (blank-apps, Ploi).
# Port 5433, damit nichts mit anderen lokalen Datenbanken kollidiert.
services:
  db:
    image: postgres:17-alpine
    container_name: calisthenics-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calisthenics
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
